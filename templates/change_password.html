{% extends "base.html" %}
{% block page_title %}{{ t('change_password') }}{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:520px">
  {% if forced %}
  <div class="alert alert-warning">{{ t('must_change') }}</div>
  {% endif %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label">{{ t('current_password') }}</label>
      <input class="form-control" type="password" name="current_password" required>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ t('new_password') }}</label>
      <input class="form-control" type="password" name="new_password" minlength="8" required>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ t('confirm_password') }}</label>
      <input class="form-control" type="password" name="confirm_password" minlength="8" required>
    </div>
    <button class="btn btn-navy" type="submit">{{ t('save') }}</button>
  </form>
</div>
{% endblock %}
