{% extends "base.html" %}
{% block page_title %}{% if row %}{{ t('edit') }}{% else %}{{ t('new_training') }}{% endif %}{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:860px">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">{{ t('education') }}</label>
      <input class="form-control" name="title" value="{{ row.title if row else '' }}" required>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">{{ t('period') }} (Start)</label>
        <input class="form-control" type="date" name="start_date" value="{{ row.start_date.strftime('%Y-%m-%d') if row else today }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">{{ t('period') }} (End)</label>
        <input class="form-control" type="date" name="end_date" value="{{ row.end_date.strftime('%Y-%m-%d') if row else today }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">{{ t('instructor') }}</label>
        <input class="form-control" name="instructor" value="{{ row.instructor if row else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">{{ t('unit_krw') }}</label>
        <input class="form-control" type="number" min="0" step="1" name="unit_price_krw" value="{{ row.unit_price_krw if row else 0 }}" required>
      </div>
    </div>
    <div class="mt-3">
      <label class="form-label">{{ t('training_learners') }}</label>
      <textarea class="form-control" name="learners" rows="8" placeholder="{{ t('training_learners_hint') }}">{{ row.learners if row else '' }}</textarea>
      <p class="muted mt-2 mb-0">{{ t('training_learners_hint') }} · {{ t('training_save_help') }}</p>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-navy" type="submit">{{ t('save') }}</button>
      <a class="btn btn-ghost" href="{{ url_for('trainings') }}">{{ t('cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
